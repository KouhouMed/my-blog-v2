baseURL: https://kouhoumed.com/
languageCode: en-us
build:
  writeStats: true
  useResourceCacheWhen: fallback
markup:
  goldmark:
    renderer:
      unsafe: true


# Add this section to enable processing of image resources
imaging:
  resampleFilter: lanczos
  quality: 75
  anchor: smart

# Add this to specify where Hugo should look for image files
staticDir:
  - static
  - images

params:
  title: Mohamed Kouhou's personal website
  author: Mohamed Kouhou
  description: "Personal portfolio of Mohamed Kouhou — Database Reliability Engineer specializing in Data Engineering, AI, and Business Intelligence."
  copyright: >-
    Powered by [Hugo](https://gohugo.io/) & deployed on
    [GitHub Pages](https://pages.github.com/)
  theme:
    mainTheme: dark
    showAttribute: true
    singlePage: false
  favicons:
    use: true
    metas: |2-
              <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
              <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
              <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
              <link rel="manifest" href="site.webmanifest">
              <link rel="mask-icon" href="safari-pinned-tab.svg" color="#252627">
              <link rel="shortcut icon" href="favicon.ico">


  profile:
    name: "Mohamed KOUHOU"
