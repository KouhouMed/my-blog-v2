<section id="signal" class="border-y border-hairline py-10">
  <div class="mx-auto w-full max-w-[1200px] px-6 md:px-10">
    <dl class="grid grid-cols-1 sm:grid-cols-3 gap-8 animate-on-scroll">

      <div>
        <dd class="font-mono text-4xl md:text-5xl text-primary tabular-nums">{{ sub now.Year 2022 }}</dd>
        <dt class="text-xs uppercase tracking-[0.14em] text-text-subtle mt-2">years in production data roles</dt>
      </div>

      <div>
        <dd class="font-mono text-4xl md:text-5xl text-primary tabular-nums">{{ len .Site.Params.project.list }}</dd>
        <dt class="text-xs uppercase tracking-[0.14em] text-text-subtle mt-2">projects shipped</dt>
      </div>

      <div>
        <dd class="font-mono text-4xl md:text-5xl text-primary tabular-nums">{{ len .Site.Params.skill.list }}</dd>
        <dt class="text-xs uppercase tracking-[0.14em] text-text-subtle mt-2">tools in the stack</dt>
      </div>

    </dl>
  </div>
</section>
