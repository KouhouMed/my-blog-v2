<section id="contact" class="border-t border-hairline py-24 md:py-32">
  <div class="mx-auto w-full max-w-[1200px] px-6 md:px-10">
    <div class="animate-on-scroll">

      <h2 class="font-heading text-3xl md:text-4xl font-semibold tracking-tightest text-text-main">
        Get in touch
      </h2>

      <p class="mt-5 text-text-muted max-w-measure leading-relaxed">
        Open to roles and collaborations in data engineering and database reliability. The fastest way to reach me is email.
      </p>

      <a href="mailto:mohamedkouhou@gmail.com"
        class="mt-8 inline-flex items-center rounded-md px-6 py-3 text-sm whitespace-nowrap
               bg-primary text-bg font-semibold hover:bg-primaryBright
               active:translate-y-px transition-colors no-underline">
        Email me
      </a>

      <div class="mt-10 flex flex-wrap gap-x-6 gap-y-2">
        {{ range .Site.Params.social.list }}
        <a href="{{ .url }}" target="_blank" rel="noopener noreferrer"
          class="inline-flex items-center gap-2 text-sm text-text-muted hover:text-primary transition-colors no-underline">
          <i class="{{ .icon }} opacity-60"></i> {{ .title }}
        </a>
        {{ end }}
      </div>

    </div>
  </div>
</section>
