<section id="about" class="py-20">
  <div class="container mx-auto px-6">
    <div class="max-w-4xl mx-auto">

      <p class="text-center font-mono text-sm text-text-subtle dark:text-text-subtle mb-3">// 02. about_me</p>
      <h2 class="text-3xl md:text-4xl font-heading font-bold mb-12 text-center">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
          {{ .Site.Params.aboutme.title }}
        </span>
      </h2>

      <div class="bg-white dark:bg-surface rounded-2xl p-8 shadow-sm dark:shadow-none border border-slate-200 dark:border-border
                  animate-on-scroll transition-all duration-700 ease-out">
        <div class="flex flex-col md:flex-row gap-8 items-center">

          {{/* Icon column */}}
          <div class="w-full md:w-1/4 flex justify-center flex-shrink-0">
            <div class="w-28 h-28 rounded-full bg-primary/10 dark:bg-primary/10 border border-primary/20
                        flex items-center justify-center text-primary text-4xl">
              <i class="{{ .Site.Params.aboutme.icon }}"></i>
            </div>
          </div>

          {{/* Text column */}}
          <div class="w-full md:w-3/4">
            <p class="text-base md:text-lg text-slate-600 dark:text-text-muted leading-relaxed">
              {{ .Site.Params.aboutme.description }}
            </p>
            <div class="mt-6 flex flex-wrap gap-6 text-sm">
              <div class="flex items-center gap-2 text-slate-500 dark:text-text-muted">
                <i class="fas fa-map-marker-alt text-primary text-xs"></i>
                {{ .Site.Params.profile.location }}
              </div>
              <div class="flex items-center gap-2 text-slate-500 dark:text-text-muted">
                <i class="fas fa-circle text-secondary text-xs animate-pulse"></i>
                Available for opportunities
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
