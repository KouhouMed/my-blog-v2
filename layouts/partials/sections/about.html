<section id="about" class="py-24 md:py-32">
  <div class="mx-auto w-full max-w-[1200px] px-6 md:px-10">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-12">

      <div class="md:col-span-4 md:sticky md:top-28 self-start">
        <h2 class="font-heading text-3xl md:text-4xl font-semibold tracking-tightest text-text-main">
          {{ .Site.Params.aboutme.title }}
        </h2>
      </div>

      <div class="md:col-span-8 animate-on-scroll">
        <p class="text-lg leading-relaxed text-text-muted max-w-measure">
          {{ .Site.Params.aboutme.description }}
        </p>

        <dl class="mt-10 grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-measure">
          <div>
            <dt class="font-mono text-xs uppercase tracking-[0.14em] text-text-subtle">Location</dt>
            <dd class="mt-1.5 text-sm text-text-main">{{ .Site.Params.profile.location }}</dd>
          </div>
          <div>
            <dt class="font-mono text-xs uppercase tracking-[0.14em] text-text-subtle">Focus</dt>
            <dd class="mt-1.5 text-sm text-text-main">Data engineering and database reliability</dd>
          </div>
        </dl>
      </div>

    </div>
  </div>
</section>
