<?xml version="1.0" encoding="UTF-8"?>
<!-- Safari pinned-tab mask icon. Must be a single solid black path on a
     transparent ground: Safari discards colour and recolours the silhouette.
     Drawn as a filled M letterform rather than a stroke so it masks cleanly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <path fill="#000000" d="M12 48V16h8l12 16 12-16h8v32h-8V28L32 44 20 28v20z"/>
</svg>
